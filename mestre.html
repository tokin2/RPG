<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mesa do mestre</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;800&family=IM+Fell+English&display=swap">
<style>
:root{--bg:#08080a;--panel:#212428;--ink:#dcd9d2;--muted:#9b9ba3;--pv:#c63a4f;--pm:#5a97d0;color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#09090a}}
:root[data-theme="dark"]{--bg:#09090a}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.35 "IM Fell English",Georgia,serif}
.wrap{max-width:1000px;margin:0 auto;padding:16px}
h1{font:800 clamp(24px,5vw,34px) Cinzel,Georgia,serif;margin:0 0 4px;color:#f2f2f0;text-shadow:0 1px 0 #000}
.sub{color:#d5d5d2;margin:0 0 16px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.card{background:var(--panel);border:2.5px solid var(--ink);border-radius:12px 7px 14px 8px;padding:12px 14px;box-shadow:2px 3px 0 rgba(0,0,0,.4)}
.card h2{font:800 20px Cinzel,serif;margin:0}
.card .m{color:var(--muted);font-size:14px;margin-bottom:8px}
.bar{height:9px;border:1.5px solid var(--ink);border-radius:5px;background:#2e3237;overflow:hidden;margin:2px 0 8px}
.bar i{display:block;height:100%}
.row{display:flex;justify-content:space-between;font-size:14px}
.row b{font-family:Cinzel,serif}
.def{display:inline-block;border:2px solid var(--ink);border-radius:6px 6px 16px 16px;padding:0 10px;font:800 20px Cinzel,serif}
a.b{display:inline-block;margin-top:8px;padding:4px 12px;border:1.5px solid var(--ink);border-radius:6px;color:var(--ink);text-decoration:none;font-size:14px}
a.b:hover{background:#2e3237}a.b+a.b{margin-left:6px}
.msg{background:var(--panel);border:2.5px solid var(--ink);border-radius:10px;padding:12px 14px}
button{font:inherit;background:var(--panel);color:var(--ink);border:1.5px solid var(--ink);border-radius:6px;padding:4px 12px;cursor:pointer;margin-bottom:14px}
.msg{background:var(--panel);border:2.5px solid var(--ink);border-radius:10px;padding:8px 12px;margin:0 0 14px;font-size:14px}
.del{margin:8px 0 0 8px;margin-bottom:0;border-color:var(--pv);color:var(--pv);font-size:14px;padding:4px 12px}
.del:disabled{opacity:.5;cursor:default}
.codew{text-align:center;margin-top:12px}.code{margin:0;padding:4px 16px;font-size:15px;border-style:dashed}.code b{font-family:Cinzel,serif;letter-spacing:.12em}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.hbtn{margin:8px 0 0 8px;margin-bottom:0;font-size:14px;padding:4px 12px}
#hp{background:var(--panel);border:2.5px solid var(--ink);border-radius:12px 7px 14px 8px;padding:12px 14px;margin:0 0 16px}
#hp h2{font:800 20px Cinzel,serif;margin:0 0 8px}
.hbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px;font-size:14px}
.hbar select{font:inherit;font-size:14px;background:var(--bg);color:var(--ink);border:1.5px solid var(--ink);border-radius:6px;padding:3px 6px;max-width:100%}
.hbar button{margin:0;font-size:14px;padding:3px 10px}
.he{border-top:1px dashed var(--muted);padding:8px 0}
.hh{font-size:14px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.hh b{font-family:Cinzel,serif}.hh .t{color:var(--muted);font-size:13px}
.tag{border:1.5px solid var(--muted);border-radius:10px;padding:0 8px;font-size:12px;color:var(--muted)}.tag.m{border-color:var(--pm);color:var(--pm)}
.he ul{margin:4px 0 0;padding-left:18px;font-size:14px}.he li{margin:1px 0}.he .c{color:var(--muted)}.he s{color:var(--muted)}
.hmore{margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
<h1>Mesa do mestre</h1>
<p class="sub" id="st">Carregando fichas…</p>
<div class="tools"><button id="rf">Atualizar agora</button><button id="hb" aria-expanded="false">Histórico de alterações</button></div>
<p class="msg" id="msg" hidden></p>
<section id="hp" hidden><h2>Histórico de alterações</h2>
<div class="hbar"><label>Ficha: <select id="hf"><option value="">Todas</option></select></label><button type="button" id="hx">Fechar</button></div>
<div id="hl">Carregando…</div></section>
<div class="grid" id="g"></div>
</div>
<script>
var SB_URL="https://tfguskhdabewpabiqbml.supabase.co",SB_KEY="sb_publishable_F9RIyN4V4nl9d4H40Wf2bw_EcuPJje7";
function n(v){return parseInt(v,10)||0}
function esc(t){var d=document.createElement("div");d.textContent=t==null?"":t;return d.innerHTML}
function pct(a,m){return m>0?Math.max(0,Math.min(100,a/m*100)):0}
var busy=false,ROWS=[],HOPEN=false;
function say(x){var m=document.getElementById("msg");m.textContent=x;m.hidden=!x}
function load(){
  fetch(SB_URL+"/rest/v1/fichas?select=id,dados,updated_at&order=updated_at.desc",{headers:{apikey:SB_KEY}})
  .then(function(r){return r.ok?r.json():Promise.reject(r.status)})
  .then(function(rows){
    ROWS=rows;if(busy)return;
    document.getElementById("st").textContent=rows.length?rows.length+" ficha(s) na mesa. Atualiza sozinho a cada 20 segundos.":"Nenhuma ficha salva ainda. Peça para o pessoal abrir e preencher a ficha.";
    document.getElementById("g").innerHTML=rows.map(function(r){
      var d=r.dados||{},def=10+Math.floor(((d["v-des"]===undefined?10:n(d["v-des"]))-10)/2)+n(d.defx),when=new Date(r.updated_at).toLocaleString("pt-BR");
      return '<div class="card"><h2>'+esc(d.nome||"Sem nome")+'</h2><div class="m">'+esc([d.raca,d.classe].filter(Boolean).join(" · "))+(d.nivel?" · nível "+esc(d.nivel):"")+'</div>'+
      '<div class="row"><span>PV</span><b>'+n(d.pv)+' / '+n(d.pvm)+'</b></div><div class="bar"><i style="width:'+pct(n(d.pv),n(d.pvm))+'%;background:var(--pv)"></i></div>'+
      '<div class="row"><span>PM</span><b>'+n(d.pm)+' / '+n(d.pmm)+'</b></div><div class="bar"><i style="width:'+pct(n(d.pm),n(d.pmm))+'%;background:var(--pm)"></i></div>'+
      '<div class="row"><span>Defesa <span class="def">'+def+'</span></span><span style="color:var(--muted);font-size:12px">'+esc(when)+'</span></div>'+
      '<div class="row" style="margin-top:6px"><span>Dado da sorte</span><b>'+(d.dado===undefined?3:Math.max(0,Math.min(3,n(d.dado))))+' / 3</b></div>'+
      '<a class="b" href="index.html?f='+encodeURIComponent(r.id)+'&ro=1">Só olhar</a><a class="b" href="index.html?f='+encodeURIComponent(r.id)+'&e=1">Editar ficha</a><button type="button" class="hbtn" data-hist="'+esc(r.id)+'">Histórico</button><button type="button" class="del" data-id="'+esc(r.id)+'">Apagar ficha</button><div class="codew"><button type="button" class="code" data-code="'+esc(r.id)+'" title="Toque para copiar o código">Código: <b>'+esc(r.id)+'</b></button></div></div>'
    }).join("");
  })
  .catch(function(e){document.getElementById("st").textContent="Não consegui carregar as fichas ("+e+"). Confira a internet e se a tabela foi criada no Supabase."});
}
document.getElementById("g").addEventListener("click",function(e){
  var b=e.target.closest&&e.target.closest(".del");if(!b)return;
  if(b.dataset.armed){delSheet(b.dataset.id,b);return}
  b.dataset.armed="1";b.textContent="Confirmar apagar?";busy=true;
  setTimeout(function(){if(!b.isConnected)return;delete b.dataset.armed;if(!b.disabled)b.textContent="Apagar ficha";busy=false},4000);
});
document.getElementById("g").addEventListener("click",function(e){
  var b=e.target.closest&&e.target.closest(".code");if(!b)return;
  var c=b.dataset.code;
  function ok(){var o=b.innerHTML;b.textContent="Copiado!";setTimeout(function(){if(b.isConnected)b.innerHTML=o},1500)}
  function fb(){var t=document.createElement("textarea");t.value=c;t.style.position="fixed";t.style.opacity="0";document.body.appendChild(t);t.select();try{document.execCommand("copy");ok()}catch(x){say("Não consegui copiar. O código é: "+c)}document.body.removeChild(t)}
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(c).then(ok,fb);else fb();
});
function delSheet(id,b){
  b.disabled=true;b.textContent="Apagando…";say("");
  fetch(SB_URL+"/rest/v1/fichas?id=eq."+encodeURIComponent(id),{method:"DELETE",headers:{apikey:SB_KEY,Prefer:"return=representation"}})
  .then(function(r){return r.ok?r.json():Promise.reject(r.status)})
  .then(function(rows){busy=false;
    if(rows.length){say("Ficha apagada.")}
    else{say("Nada foi apagado. Falta criar no Supabase a regra que permite apagar (veja a instrução que o Claude passou).")}
    load()})
  .catch(function(e){busy=false;say("Não consegui apagar ("+e+"). Confira a internet e a regra de apagar no Supabase.");load()});
}
var HLIM=150;
function hfmt(t){try{return new Date(t).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}catch(x){return t}}
function loadHist(){
  if(!HOPEN)return;
  fetch(SB_URL+"/rest/v1/historico?select=id,ficha_id,nome,autor,mudancas,criado_em&order=criado_em.desc&limit="+HLIM,{headers:{apikey:SB_KEY}})
  .then(function(r){return r.ok?r.json():Promise.reject(r.status)})
  .then(function(rows){
    var sel=document.getElementById("hf"),cur=sel.value,names={},ord=[];
    ROWS.forEach(function(r){names[r.id]=((r.dados&&r.dados.nome)||"Sem nome");ord.push(r.id)});
    rows.forEach(function(h){if(!(h.ficha_id in names)){names[h.ficha_id]=(h.nome||"Sem nome")+" (apagada)";ord.push(h.ficha_id)}});
    sel.innerHTML='<option value="">Todas</option>'+ord.map(function(id){return '<option value="'+esc(id)+'">'+esc(names[id])+'</option>'}).join("");
    sel.value=ord.indexOf(cur)>=0?cur:"";
    var f=sel.value,list=rows.filter(function(h){return !f||h.ficha_id===f});
    document.getElementById("hl").innerHTML=list.length?list.map(function(h){
      var ch=(h.mudancas||[]).map(function(c){return '<li><span class="c">'+esc(c.campo)+':</span> <s>'+esc(c.de)+'</s> → <b>'+esc(c.para)+'</b></li>'}).join("");
      return '<div class="he"><div class="hh"><b>'+esc(h.nome||names[h.ficha_id]||"Sem nome")+'</b><span class="tag'+(h.autor==="mestre"?" m":"")+'">'+(h.autor==="mestre"?"mestre":"jogador")+'</span><span class="t">'+esc(hfmt(h.criado_em))+'</span></div><ul>'+ch+'</ul></div>'}).join("")+(rows.length>=HLIM?'<p class="hmore sub">Mostrando os '+HLIM+' registros mais recentes.</p>':""):'<p class="sub">Nenhuma alteração registrada ainda. Os registros aparecem conforme as fichas são alteradas.</p>';
  })
  .catch(function(e){document.getElementById("hl").innerHTML='<p class="sub">Não consegui carregar o histórico ('+esc(e)+'). Confira se a tabela <b>historico</b> foi criada no Supabase (veja a instrução que o Claude passou).</p>'});
}
function openHist(id){HOPEN=true;var p=document.getElementById("hp");p.hidden=false;document.getElementById("hb").setAttribute("aria-expanded","true");if(id!==undefined)document.getElementById("hf").value=id;loadHist();if(id!==undefined)p.scrollIntoView({behavior:"smooth",block:"start"})}
function closeHist(){HOPEN=false;document.getElementById("hp").hidden=true;document.getElementById("hb").setAttribute("aria-expanded","false")}
document.getElementById("hb").onclick=function(){HOPEN?closeHist():openHist()};
document.getElementById("hx").onclick=closeHist;
document.getElementById("hf").onchange=loadHist;
document.getElementById("g").addEventListener("click",function(e){var b=e.target.closest&&e.target.closest(".hbtn");if(!b)return;var id=b.dataset.hist;HOPEN=true;document.getElementById("hp").hidden=false;var sel=document.getElementById("hf");if(!sel.querySelector('option[value="'+id.replace(/"/g,'\\"')+'"]')){var o=document.createElement("option");o.value=id;o.textContent=id;sel.appendChild(o)}openHist(id)});
document.getElementById("rf").onclick=function(){load();loadHist()};
load();setInterval(function(){load();loadHist()},20000);
</script>
</body>
</html>
